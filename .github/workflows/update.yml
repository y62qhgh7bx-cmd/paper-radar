name: Daily Paper Radar update

on:
  schedule:
    - cron: "0 22 * * *"   # UTC 22:00 = 6:00 AM Taipei time
  workflow_dispatch:        # can also be triggered manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and score
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 fetch_and_score.py

      - name: Sync starred/liked papers to Zotero
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
        run: python3 sync_to_zotero.py

      - name: Commit update
        run: |
          git config user.name "paper-radar-bot"
          git config user.email "actions@github.com"
          git add docs/papers.json marks.json
          git diff --cached --quiet && exit 0
          git commit -m "auto-update papers.json / sync marks ($(date -u +%F))"
          # The live page can PUT marks.json directly via the GitHub API at any
          # time, so a plain push can race with it. Pull --rebase and retry a
          # few times before giving up.
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "push attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "::error::Could not push after 5 attempts"
          exit 1
